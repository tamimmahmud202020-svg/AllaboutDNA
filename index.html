<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ডিএনএ স্টাডি হাব</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Noto+Serif+Bengali:wght@500;700&display=swap">
<style>
:root{--bg:#070618;--card:rgba(255,255,255,.07);--fg:#ecebff;--mut:#a29fd4;--pri:#9b7bff;--ok:#22c55e;--bad:#fb7185;--bd:rgba(255,255,255,.13);--glow:rgba(155,123,255,.4);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070618}}
:root[data-theme="dark"]{--bg:#070618}
:root[data-theme="light"]{--bg:#f1f0ff;--card:rgba(255,255,255,.75);--fg:#1b1740;--mut:#6b6896;--bd:rgba(124,92,255,.22)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 'Hind Siliguri',system-ui,sans-serif;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(600px 420px at 8% -8%,rgba(124,92,255,.38),transparent),radial-gradient(520px 420px at 105% 25%,rgba(34,211,238,.2),transparent),radial-gradient(640px 520px at 50% 112%,rgba(244,114,182,.25),transparent)}
.hero{max-width:600px;margin:0 auto;padding:12px 16px 0}.ht{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{margin:0;font-size:24px;line-height:1.3;background:linear-gradient(90deg,#c4b5fd,#67e8f9,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent;cursor:pointer}
.sub{font-size:13px;color:var(--mut)}.stk{background:var(--card);border:1px solid var(--bd);padding:4px 11px;border-radius:14px;font-size:14px;white-space:nowrap}
#hx{width:100%;height:110px;display:block}.xp{display:flex;align-items:center;gap:8px}.xp b,.xp small{font-size:12.5px;white-space:nowrap}.xp .bar{flex:1;margin:0}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#7c5cff,#22d3ee,#f472b6);width:0;transition:.6s;border-radius:9px}
.bdg{display:flex;gap:8px;justify-content:center;margin:10px 0 2px}.bdg span{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:var(--card);border:1px solid var(--bd);filter:grayscale(1);opacity:.4;font-size:17px;transition:.4s}
.bdg span.on{filter:none;opacity:1;box-shadow:0 0 14px var(--glow)}
body.imm .hx,body.imm .bdg,body.imm .sub{display:none}
main{max-width:600px;margin:0 auto;padding:10px 14px 120px}main>*{animation:up .45s both}
@keyframes up{from{opacity:0;transform:translateY(14px)}}@keyframes pop{from{transform:scale(0);opacity:0}}
.card,details{background:var(--card);border:1px solid var(--bd);border-radius:20px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding:14px;margin:12px 0}
details{padding:4px 16px;transition:.3s}details[open]{border-color:var(--pri);box-shadow:0 0 24px var(--glow)}
summary{font-weight:700;padding:10px 0;cursor:pointer;font-size:17px}li{margin:5px 0}ul{padding-left:20px;margin:6px 0}
.btn{border:0;background:linear-gradient(135deg,#7c5cff,#c026d3);color:#fff;padding:10px 17px;border-radius:14px;font:inherit;margin:4px 4px 4px 0;box-shadow:0 4px 16px var(--glow);transition:.2s}.btn:active{transform:scale(.95)}
.btn.g{background:var(--card);color:var(--fg);border:1px solid var(--bd);box-shadow:none}.btn.done{background:linear-gradient(135deg,#16a34a,#22d3ee)}
nav{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);z-index:5;display:flex;gap:2px;padding:6px;border-radius:26px;background:rgba(16,14,44,.8);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid var(--bd);box-shadow:0 10px 40px rgba(0,0,0,.5);max-width:560px;margin:0 auto}
nav button{flex:1;min-width:0;border:0;background:none;color:var(--mut);padding:6px 1px;border-radius:20px;font:inherit;display:flex;flex-direction:column;align-items:center;line-height:1.25;transition:.25s}
nav button span{font-size:19px;transition:.25s}nav button small{font-size:9.5px;white-space:nowrap}
nav button.on{background:linear-gradient(135deg,#7c5cff,#c026d3);color:#fff;box-shadow:0 4px 18px var(--glow)}nav button.on span{transform:translateY(-2px) scale(1.15)}
.facts{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px}.facts div{flex:0 0 auto;min-width:94px;text-align:center;padding:10px 8px;border-radius:16px;background:linear-gradient(160deg,rgba(124,92,255,.38),rgba(34,211,238,.16));border:1px solid var(--bd)}.facts b{display:block;font-size:21px}.facts small{font-size:11px;color:var(--mut)}
.seq{display:flex;gap:6px;justify-content:center;margin:8px 0}
.nt{width:44px;height:52px;border-radius:12px;border:2px solid;display:flex;align-items:center;justify-content:center;font:700 20px 'Hind Siliguri';background:var(--card);color:var(--fg)}
.A{border-color:#ff5d6c}.T{border-color:#4da3ff}.G{border-color:#3ddc84}.C{border-color:#ffc23d}
.slot.ok{background:rgba(34,197,94,.3)}.slot.bad{background:rgba(251,113,133,.3)}
.hb{display:flex;gap:6px;justify-content:center;color:var(--mut);font-size:12px}.hb span{width:44px;text-align:center}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--fg);font:inherit;transition:.2s}
.opt:active{transform:scale(.98)}.opt.ok{background:rgba(34,197,94,.28);border-color:var(--ok)}.opt.bad{background:rgba(251,113,133,.25);border-color:var(--bad)}
.fc{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:19px;cursor:pointer;font-weight:600;background:linear-gradient(160deg,rgba(124,92,255,.3),rgba(34,211,238,.12))}
.step{font-size:44px;text-align:center}.dots{text-align:center}.dots b{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bd);margin:0 3px}.dots b.on{background:var(--pri)}
.mut{color:var(--mut);font-size:14px}.tip{background:rgba(251,191,36,.14);border-left:4px solid #fbbf24;padding:8px 12px;border-radius:10px;margin:8px 0}
.stage{position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--bd);background:#04030f;box-shadow:0 0 40px var(--glow);margin:6px 0}
.stage canvas{display:block;width:100%;touch-action:none}.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.7))}
.spd{display:flex;gap:6px;margin:8px 0;align-items:center}.spd:before{content:"⚡ গতি";font-size:13px;color:var(--mut);margin-right:2px}
.spd button,.sc{border:1px solid var(--bd);background:var(--card);color:var(--fg);padding:6px 11px;border-radius:12px;font:inherit;font-size:13px}
.spd button.on,.sc.on{background:linear-gradient(135deg,#7c5cff,#c026d3);color:#fff;border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.sc{flex:0 0 auto}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;margin:6px 0}.lg i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:4px;vertical-align:-1px}.lg i.b{border-radius:3px;border:3px solid;background:none;width:13px;height:13px}
.inp{background:var(--card);border:1px solid var(--bd);color:var(--fg);padding:10px 12px;border-radius:12px;font:inherit;width:150px}
.tiles{display:flex;flex-wrap:wrap;gap:4px;margin:12px 0}.tl{display:flex;flex-direction:column;align-items:center;animation:pop .4s both}
.tl span{width:24px;height:24px;border-radius:7px;border:2px solid;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}.tl em{font-size:10px;color:var(--mut);font-style:normal;line-height:1}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#7c5cff,#c026d3);color:#fff;padding:8px 18px;border-radius:20px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.45);animation:tst 2.2s forwards;white-space:nowrap}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-14px)}12%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-10px)}}
#intro{position:fixed;inset:0;z-index:50;background:#06031a;color:#fff;overflow:hidden;clip-path:circle(150% at 50% 50%);transition:clip-path .9s cubic-bezier(.7,0,.3,1)}
#intro.out{clip-path:circle(0% at 50% 50%)}#ic{position:absolute;inset:0;width:100%;height:100%}
#land{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;text-align:center;padding:0 24px calc(env(safe-area-inset-bottom,0px) + 56px);transition:opacity .7s;text-shadow:0 2px 24px rgba(10,5,60,.55)}
#land.hide{opacity:0;pointer-events:none}#land .kick{font-size:13px;letter-spacing:.14em;opacity:.9}
#land h2{margin:4px 0;font:700 72px/1.1 'Noto Serif Bengali','Hind Siliguri',serif}#land p{margin:4px 0 22px;font-size:17px;opacity:.95}#land small{margin-top:14px;opacity:.75}
.gobtn{border:0;background:#fff;color:#2b1a7a;padding:14px 30px;border-radius:40px;font:700 18px 'Hind Siliguri',sans-serif;box-shadow:0 10px 40px rgba(124,92,255,.65);animation:pls 2s infinite}
@keyframes pls{50%{transform:scale(1.06);box-shadow:0 10px 60px rgba(124,92,255,.95)}}
#icap{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);text-align:center;padding:0 22px;text-shadow:0 2px 22px rgba(0,0,0,.7);pointer-events:none}
#icap button{pointer-events:auto;margin-top:12px}#icap.in{animation:fup .9s both}@keyframes fup{from{opacity:0;transform:translateY(16px)}}
#icap .k{font:700 42px/1.2 'Noto Serif Bengali','Hind Siliguri',serif}#icap .k.sm{font-size:32px}#icap p{margin:6px 0;font-size:18px}
#ipb{position:absolute;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,#67e8f9,#f472b6)}
.ib{position:absolute;top:calc(env(safe-area-inset-top,0px) + 12px);border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:#fff;padding:6px 14px;border-radius:20px;font:inherit;font-size:14px}
#skip{right:14px}#mute{left:14px}#intro:not(.run) #skip,#intro:not(.run) #ipb{display:none}
#land .gobtn{margin-top:18px}
:root[data-theme="light"] h1{background:linear-gradient(90deg,#5b3df5,#0891b2,#c026d3);-webkit-background-clip:text;background-clip:text}
</style>
</head>
<body>
<div id="intro"><canvas id="ic"></canvas><div id="ipb"></div>
 <button class="ib" id="skip" onclick="enterHub()">ছাড়ো ⏭</button>
 <div id="icap"></div>
 <div id="land"><div class="kick">ইন্টারঅ্যাক্টিভ স্টাডি হাব</div><h2>ডিএনএ</h2><button class="gobtn" onclick="startIntro()">▶ শুরু করো</button></div></div>
<header class="hero">
 <div class="ht"><div><h1 onclick="confetti()">🧬 ডিএনএ স্টাডি হাব</h1><div class="sub">ছুঁয়ে · ঘুরিয়ে · খেলে শেখো</div></div><div class="stk" id="stk"></div></div>
 <canvas id="hx" class="hx"></canvas>
 <div class="bdg" id="bd"></div>
</header>
<nav id="nav"></nav>
<main id="m"></main>
<script>
const $=s=>document.querySelector(s);
let P={read:[],known:[],best:0,xp:0,streak:0,last:'',lab:0,rep:0,nm:0,qok:[],bg:[]};
try{P=Object.assign(P,JSON.parse(localStorage.getItem('dnahub')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('dnahub',JSON.stringify(P))}catch(e){}};

const LESSON=[
["🧬 ডিএনএ কী?",["পূর্ণরূপ: ডিঅক্সিরাইবোনিউক্লিক অ্যাসিড (Deoxyribonucleic Acid)","জীবদেহের গঠন ও কাজ নিয়ন্ত্রণের <b>জিনগত তথ্য</b> ধারণ করে — একে বলা হয় <b>বংশগতির রাসায়নিক ভিত্তি</b>","অবস্থান: নিউক্লিয়াসের ক্রোমোজোম; মাইটোকন্ড্রিয়া ও ক্লোরোপ্লাস্টে (বৃত্তাকার)","গঠনগত একক: <b>নিউক্লিওটাইড</b>"]],
["🔬 আবিষ্কার",["<b>১৯৫৩</b> সালে জেমস ওয়াটসন (আমেরিকান) ও ফ্রান্সিস ক্রিক (ব্রিটিশ) ডাবল হেলিক্স কাঠামো বর্ণনা করেন","এজন্য তাঁরা <b>১৯৬২</b> সালে নোবেল পুরস্কার পান"]],
["🏗️ ডিএনএর গঠন",["<b>দ্বি-সূত্রক:</b> দুটি পলিনিউক্লিওটাইড স্ট্র্যান্ড পেঁচানো সিঁড়ির মতো জড়ানো","<b>অ্যান্টিপ্যারালাল:</b> একটি ৫′→৩′, অন্যটি ৩′→৫′","<b>বেস পেয়ার:</b> A↔T (২টি H-বন্ধন), G↔C (৩টি H-বন্ধন)","<b>পিউরিন:</b> A, G &nbsp;|&nbsp; <b>পাইরিমিডিন:</b> C, T","<b>পরিমাপ:</b> পূর্ণ ঘূর্ণন = ৩৪ Å; প্রতি ঘূর্ণনে ১০ জোড়া; জোড়ার দূরত্ব = ৩.৪ Å; ব্যাস = ২০ Å"],"মনে রাখার কৌশল: ৩.৪ × ১০ = ৩৪ Å। আর G-C তে বন্ধন বেশি (৩), তাই G-C বেশি শক্ত।"],
["⚙️ কাজ",["জিনগত তথ্য সংরক্ষণ","প্রোটিন সংশ্লেষণের নির্দেশ সরবরাহ","বংশগতি — পিতা-মাতা থেকে সন্তানে বৈশিষ্ট্য স্থানান্তর","শারীরতাত্ত্বিক ও জৈবিক কাজের নিয়ন্ত্রণ","বিবর্তনের ভিত্তি"]],
["🔄 ডিএনএ প্রতিরূপ",["কোষ বিভাজনের আগে একটি DNA থেকে <b>হুবহু দুটি</b> নতুন DNA তৈরি","প্রয়োজন: নতুন কোষে সমান DNA, বংশগত বৈশিষ্ট্য অপরিবর্তিত, বৃদ্ধি ও ক্ষত মেরামত","ধাপগুলো দেখতে <b>প্রতিরূপ</b> ট্যাবে যাও 👉"]],
["🧬 কেন্দ্রীয় নীতি",["<b>DNA → জিন → RNA → প্রোটিন → বৈশিষ্ট্য</b>","জিন: DNA-এর নির্দিষ্ট অংশ যা একটি বৈশিষ্ট্যের জন্য দায়ী","RNA: DNA ও প্রোটিনের মাঝে বার্তাবাহক","প্রোটিন: দেহের বৈশিষ্ট্য নির্ধারণ করে"]],
["🧪 ডিএনএ টেস্ট",["বিজ্ঞানভিত্তিক পদ্ধতির নাম <b>ডিএনএ ফিঙ্গার প্রিন্টিং</b>","নমুনা: হাড়, দাঁত, চুল, রক্ত, লালা, টিস্যু ইত্যাদি","ব্যবহার: পিতৃত্ব/মাতৃত্ব নির্ধারণ, অপরাধ তদন্ত, মৃতদেহ শনাক্ত, বংশগত রোগ নির্ণয় (থ্যালাসিমিয়া, হিমোফিলিয়া), কৃষি (ধান, গম, মাছ, গবাদি পশুর জাত উন্নয়ন)","সুবিধা: নির্ভুল, দ্রুত ফল, অপরাধী শনাক্তে ও আত্মীয়তা নির্ধারণে কার্যকর","সীমাবদ্ধতা: ব্যয়বহুল, উন্নত ল্যাব ও বিশেষজ্ঞ লাগে, গোপনীয়তার উদ্বেগ"]]

function pj(px,py,pz){const cy=Math.cos(V.yaw),sy=Math.sin(V.yaw),cp=Math.cos(V.pitch),sp=Math.sin(V.pitch);
 const y1=py-V.fy,x2=px*cy+pz*sy,z2=-px*sy+pz*cy,y3=y1*cp-z2*sp,z3=y1*sp+z2*cp+V.d,s=F/z3;return[W/2+x2*s,H/2-y3*s,z3,s]}
const lp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];

 let h=g.createRadialGradient(p[0],p[1],0,p[0],p[1],pr*2.4);h.addColorStop(0,c);h.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=h;g.beginPath();g.arc(p[0],p[1],pr*2.4,0,6.3);g.fill();
 g.globalCompositeOperation='source-over';g.globalAlpha=al;
 h=g.createRadialGradient(p[0]-pr*.3,p[1]-pr*.3,0,p[0],p[1],pr);h.addColorStop(0,'#fff');h.addColorStop(.3,c);h.addColorStop(1,'#1a1440');g.fillStyle=h;g.beginPath();g.arc(p[0],p[1],pr,0,6.3);g.fill()}

 raf=requestAnimationFrame(draw);
 V.d+=(V.td-V.d)*.07;V.fy+=(V.tfy-V.fy)*.07;V.pitch+=(V.tp-V.pitch)*.07;
 if(!V.drag){V.yaw+=V.vy;V.vy+=(bsp()-V.vy)*.03}
 F=Math.min(W,H)*1.15;g.setTransform(dpr,0,0,dpr,0,0);g.globalAlpha=1;
 const bg=g.createRadialGradient(W/2,H/2,10,W/2,H/2,Math.max(W,H)*.7);bg.addColorStop(0,'#1c1250');bg.addColorStop(1,'#04030f');g.fillStyle=bg;g.fillRect(0,0,W,H);
 for(const d of DUST){d[1]-=.15;if(d[1]<-300)d[1]=300;const p=pj(d[0],d[1],d[2]);if(p[2]>20){g.globalAlpha=.5;g.fillStyle='#b9a8ff';g.fillRect(p[0],p[1],1.6,1.6)}}
 const it=[],A=[],B=[],pa=[],pb=[];V.pc=[];
 for(let i=0;i<30;i++){const a=i*TW,y=Yp(i);A[i]=[R3*Math.cos(a),y,R3*Math.sin(a)];B[i]=[R3*Math.cos(a+OFF),y,R3*Math.sin(a+OFF)];pa[i]=pj(...A[i]);pb[i]=pj(...B[i])}
 for(let i=0;i<30;i++){
  const al=(!V.hl||(i>=V.hl[0]&&i<=V.hl[1]))?1:.25,b1=SEQ[i],b2=CPL[b1],L1='AG'.includes(b1)?.5:.36,L2='AG'.includes(b2)?.5:.36;
  const e1=pj(...lp(A[i],B[i],L1)),e2=pj(...lp(B[i],A[i],L2)),qm=pj(...lp(A[i],B[i],.5)),n=(b1=='G'||b1=='C')?3:2;V.pc[i]=qm;
  it.push([qm[2],()=>{const s=qm[3],f=al*fog(qm[2]);g.globalAlpha=f;g.lineCap='round';g.lineWidth=Math.max(6,4.6*s);seg(pa[i],e1,COL[b1]);seg(pb[i],e2,COL[b2]);
   g.lineWidth=1.1*s;g.setLineDash([2.2*s,1.6*s]);for(let k=0;k<n;k++){const o=(k-(n-1)/2)*2.6*s;g.beginPath();g.moveTo(e1[0],e1[1]-o);g.lineTo(e2[0],e2[1]-o);g.strokeStyle='#fff';g.stroke()}g.setLineDash([]);
   if(s>1){const fs=Math.max(9,4.6*s);g.globalAlpha=f;txt(b1,[(pa[i][0]+e1[0])/2,(pa[i][1]+e1[1])/2],'#111',fs);txt(b2,[(pb[i][0]+e2[0])/2,(pb[i][1]+e2[1])/2],'#111',fs)}}]);
  it.push([pa[i][2],()=>ball(pa[i],6,'#8b8bff',al*fog(pa[i][2]))]);
  it.push([pb[i][2],()=>ball(pb[i],6,'#f472b6',al*fog(pb[i][2]))]);
  if(i){for(const [P,Q,c] of [[pa,A,'#8b8bff'],[pb,B,'#f472b6']])it.push([(P[i][2]+P[i-1][2])/2,()=>{g.globalAlpha=al*fog(P[i][2]);g.lineWidth=2.6*P[i][3];g.lineCap='round';seg(P[i-1],P[i],c)}])}
 }
 for(const [P,y,t,c] of [[A[0],12,'৫′','#8b8bff'],[B[0],12,'৩′','#f472b6'],[A[29],-12,'৩′','#8b8bff'],[B[29],-12,'৫′','#f472b6']]){const q=pj(P[0],P[1]+y,P[2]);it.push([q[2],()=>{g.globalAlpha=fog(q[2]);txt(t,q,c,Math.max(11,5*q[3]))}])}
 it.sort((a,b)=>b[0]-a[0]).forEach(f=>f[1]());
 g.globalAlpha=.75;g.font='12px sans-serif';g.textAlign='left';g.fillStyle='#fff';g.fillText('🔍 '+(560/V.d).toFixed(1)+'×',10,H-10);
}
function selPair(i){V.step=-1;V.tfy=Yp(i);V.td=125;V.tp=.2;V.hl=[i,i];const b=SEQ[i],c=CPL[b],n=(b=='G'||b=='C')?3:2;

function initCv(loop,init){
